    <style>:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}html,body{overscroll-behavior:none;background:#0b3d5c;height:100%;margin:0;overflow:hidden}body{font:14px/1.4 var(--f-body,system-ui, -apple-system, "Segoe UI", sans-serif);color:#fff3dc;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-touch-callout:none}#game{position:fixed;inset:0}#game canvas{width:100%;height:100%;display:block}#hud,#menu,#mute,#helm,#status,#hint,#chest,.mnote{zoom:var(--ui,1)}svg.emo{vertical-align:-.3em;width:1.3em;height:1.3em;margin:0 .04em;display:inline-block}#stick-zone{z-index:2;touch-action:none;position:fixed;inset:0}#stick-zone .stick-base,#stick-zone .stick-knob{pointer-events:none;will-change:transform;border-radius:50%;display:none;position:absolute;top:0;left:0}#stick-zone.on .stick-base,#stick-zone.on .stick-knob{display:block}#stick-zone .stick-base{background:rgb(var(--deep-rgb,11 31 53) / .2);box-sizing:border-box;border:3px solid #f4d98c99;width:104px;height:104px;margin:-52px 0 0 -52px}#stick-zone .stick-knob{background:#fff3dcd0;width:50px;height:50px;margin:-25px 0 0 -25px;box-shadow:inset 0 0 0 3px #d7ae55,0 2px 8px #0006}body.harbour #status,body.harbour #mute,body.harbour #helm{display:none}#helm{z-index:3;left:calc(60px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));background:var(--navy,#12304f);box-shadow:inset 0 0 0 2px var(--navy,#12304f), 0 5px 12px #040c1866;border:2px solid #d7ae55;border-radius:8px;gap:3px;padding:3px;display:flex;position:fixed}#helm button{cursor:pointer;height:30px;color:var(--dim,#8fa3b8);font:400 12px var(--f-display,Georgia, serif);letter-spacing:.04em;background:0 0;border:0;border-radius:5px;align-items:center;gap:5px;padding:0 10px;display:flex}#helm button svg.emo{vertical-align:0;opacity:.6;width:20px;height:20px;margin:0}#helm button[aria-pressed=true]{color:var(--navy-deep,#0b1f35);background:#d7ae55}#helm button[aria-pressed=true] svg.emo{opacity: px;height:34px;font-size:15px}}@media (width<=520px){#hint{gap:7px;padding:6px 14px 6px 8px;font-size:14px}#hint svg{width:24px;height:24px}}#lab{z-index:4;left:calc(10px + env(safe-area-inset-left));top:calc(48px + env(safe-area-inset-top));position:fixed}#chest{z-index:50;background:radial-gradient(circle at 50% 42%, var(--navy,#12304f) 0, var(--navy-ink,#081a2c) 72%);color:#fff3dc;font-family:var(--f-body,system-ui, sans-serif);font-synthesis:none;-webkit-user-select:none;user-select:none;place-items:center;display:grid;position:fixed;inset:0}#chest .cbox{width:min(340px, calc(var(--vw,1vw) * 86));text-align:center;flex-direction:column;align-items:center;gap:8px;display:flex}#chest .cart{filter:drop-shadow(0 12px 18px #000a);width:190px;height:190px;animation:1.6s ease-in-out infinite chestwobble}#chest .cart svg{width:100%;height:100%}#chest .cbox>b{font:400 26px var(--f-display,Georgia, serif);letter-spacing:.05em;color:#f4d98c;text-shadow:0 3px #8a6a3a,0 6px 14px #0008}#chest .cbox>small{opacity:.9;font-size:16px;font-weight:600;animation:1.2s infinite blink}#chest .r1 .cart{filter:drop-shadow(0 0 22px #9fd8ff)drop-shadow(0 12px 18px #000a)}#chest .r2 .cart{filter:drop-shadow(0 0 26px #ffd24e)drop-shadow(0 12px 18px #000a)}#chest .r3 .cart{filter:drop-shadow(0 0 32px #c08aff)drop-shadow(0 12px 18px #000a)}#chest .up .cart{animation:.45s ease-out chestup}#chest .burst .cart{animation:.38s ease-in forwards chestburst}#chest .open .cart{width:110px;height:110px;animation:none}#chest .loot{flex-direction:column;gap:8px;width:100%;animation:.35s ease-out lootin;display:flex}#chest .lgold{font:400 32px var(--f-display,Georgia, serif);color:#f4d98c;flex-direction:column;align-items:center;display:flex}#chest .lgold svg{vertical-align:-5px;width:30px;height:30px}#chest .lgold small{font:600 12px var(--f-body,system-ui, sans-serif);color:var(--mist,#c9d5e2)}#chest .llook{color:#3a2a17;text-align:left;box-shadow:inset 0 0 0 3px #f3e4c3, inset 0 0 0 5px var(--rc,#c4a46a
